  <rect x="718" y="184" width="270" height="94" rx="18" fill="#F8FAFC" stroke="#D8E0EA"/>
  <text x="746" y="228" font-family="Inter, Arial" font-size="21" font-weight="700" fill="#0F172A">Feedback</text>
