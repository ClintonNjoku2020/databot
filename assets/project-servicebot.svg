<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ServiceBot demo preview</title>
  <desc id="desc">Screenshot style preview of a customer support chatbot with booking, live call, feedback, and agent handoff panels.</desc>
  <rect width="1200" height="760" rx="32" fill="#F8FAFC"/>
  <rect x="62" y="52" width="1076" height="656" rx="28" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="3"/>
  <rect x="62" y="52" width="1076" height="94" rx="28" fill="#2563EB"/>
  <text x="112" y="112" font-family="Inter, Arial" font-size="30" font-weight="800" fill="#FFFFFF">ServiceBot</text>
  <rect x="106" y="184" width="270" height="94" rx="18" fill="#EFF6FF" stroke="#DBEAFE"/>
