<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Intelligent workflow automation diagram</title>
  <desc id="desc">A connected workflow showing input data moving through an AI assistant, an LLM, automated processes, and business action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="nodeTeal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#CBD5E1" stroke-width="2">
    <path d="M120 118h720"/>
    <path d="M120 482h720"/>
    <path d="M120 118v364"/>
    <path d="M840 118v364"/>
  </g>
  <g opacity=".55" stroke="#93C5FD" stroke-width="2">
    <path d="M178 180h112M672 180h112M178 420h112M672 420h112"/>
    <path d="M240 174v12M720 174v12M240 414v12M720 414v12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="88" y="248" width="164" height="104" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="170" y="286" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Input / Data</text>
    <text x="170" y="318" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">files, prompts, signals</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="326" y="206" width="192" height="188" rx="8" fill="url(#nodeBlue)"/>
    <circle cx="422" cy="278" r="42" fill="#FFFFFF" fill-opacity=".18" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="2"/>
    <path d="M398 280c11-28 37-28 48 0M398 280c11 28 37 28 48 0M380 278h84M422 236v84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="422" y="348" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">AI / LLM</text>
    <text x="422" y="374" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="14">assistant reasoning layer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="594" y="248" width="164" height="104" rx="8" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="676" y="286" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Automated</text>
    <text x="676" y="311" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Workflow</text>
    <g fill="url(#nodeTeal)">
      <circle cx="632" cy="330" r="7"/>
      <circle cx="676" cy="330" r="7"/>
      <circle cx="720" cy="330" r="7"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="382" y="446" width="196" height="86" rx="8" fill="#0F172A"/>
    <text x="480" y="483" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Decision / Action</text>
    <text x="480" y="509" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="14">business value output</text>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 300h58"/>
    <path d="M300 290l12 10-12 10"/>
    <path d="M518 300h58"/>
    <path d="M566 290l12 10-12 10"/>
  </g>
  <g fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M676 352c0 82-68 118-158 128"/>
    <path d="M530 467l-14 14 18 10"/>
    <path d="M422 394c0 28 18 52 45 71"/>
    <path d="M452 464l17 3-2-18"/>
  </g>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2">
    <circle cx="238" cy="180" r="28"/>
    <circle cx="722" cy="180" r="28"/>
    <circle cx="238" cy="420" r="28"/>
    <circle cx="722" cy="420" r="28"/>
  </g>
  <g fill="#2563EB" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
    <text x="238" y="185">API</text>
    <text x="722" y="185">BOT</text>
    <text x="238" y="425">DATA</text>
    <text x="722" y="425">OPS</text>
  </g>
</svg>
